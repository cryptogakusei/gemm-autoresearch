default_permissions = "gemm-autoresearch"
web_search = "disabled"
cli_auth_credentials_store = "file"

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false

[features]
apps = false
# The V8-backed code-mode host requires executable JIT memory. Keep the host
# service's MemoryDenyWriteExecute boundary and use the regular shell backend.
code_mode_host = false
goals = false
hooks = false
memories = false
multi_agent = false
remote_plugin = false
unified_exec = true

[permissions.gemm-autoresearch]
description = "Read the trusted GEMM repository and edit only the candidate source."

[permissions.gemm-autoresearch.filesystem]
":root" = "deny"
":minimal" = "read"
":tmpdir" = "deny"
":slash_tmp" = "deny"
"/run/gemm-autoresearch" = "read"
"/var/lib/gemm-agent/.codex/packages/standalone/releases" = "read"

[permissions.gemm-autoresearch.filesystem.":workspace_roots"]
"." = "read"
"candidate" = "write"

[permissions.gemm-autoresearch.network]
# Enable the sandbox proxy so the Unix-socket allowlist is active. With no
# domain allow entries below, all TCP/HTTP destinations remain blocked.
enabled = true

[permissions.gemm-autoresearch.network.unix_sockets]
"/run/gemm-autoresearch/controller.sock" = "allow"
