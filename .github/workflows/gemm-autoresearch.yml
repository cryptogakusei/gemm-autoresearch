name: Trusted GEMM autoresearch

on:
  # The workflow definition and default checkout come from protected main, not
  # from the pull request. PR source remains untrusted data.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# pull_request_target normally has elevated trust. Keep its token read-only and
# do not expose repository secrets to this workflow.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dgx-gemm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-scope:
    name: Candidate scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate_sha: ${{ steps.scope.outputs.candidate_sha }}
      verifier_sha: ${{ steps.scope.outputs.verifier_sha }}
      candidate_repository: ${{ steps.scope.outputs.candidate_repository }}
    steps:
      - name: Resolve immutable refs and reject protected changes
        id: scope
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const shaPattern = /^[0-9a-f]{40}$/;
            const repoPattern = /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/;

            if (context.eventName === "workflow_dispatch") {
              if (!shaPattern.test(context.sha)) {
                core.setFailed("Manual dispatch did not resolve to a full commit SHA.");
                return;
              }
              core.setOutput("candidate_sha", context.sha);
              core.setOutput("verifier_sha", context.sha);
              core.setOutput("candidate_repository", `${context.repo.owner}/${context.repo.repo}`);
              return;
            }

            const pr = context.payload.pull_request;
            if (!pr || pr.base.ref !== "main") {
              core.setFailed("Only pull requests targeting main are accepted.");
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const changed = files.map((file) => file.filename);
            const allowed = "candidate/candidate_gemm.cu";
            if (changed.length !== 1 || changed[0] !== allowed) {
              core.setFailed(
                `Autoresearch PRs must change exactly ${allowed}. Changed: ${changed.join(", ") || "none"}`
              );
              return;
            }

            const candidateSha = pr.head.sha;
            const verifierSha = pr.base.sha;
            const candidateRepository = pr.head.repo?.full_name;
            if (!shaPattern.test(candidateSha) || !shaPattern.test(verifierSha)) {
              core.setFailed("GitHub supplied an invalid candidate or verifier SHA.");
              return;
            }
            if (!candidateRepository || !repoPattern.test(candidateRepository)) {
              core.setFailed("GitHub supplied an invalid candidate repository name.");
              return;
            }

            core.setOutput("candidate_sha", candidateSha);
            core.setOutput("verifier_sha", verifierSha);
            core.setOutput("candidate_repository", candidateRepository);

  dgx-verify-and-score:
    name: Trusted DGX verifier
    needs: candidate-scope
    runs-on: [self-hosted, linux, ARM64, dgx-spark]
    timeout-minutes: 45
    steps:
      - name: Prepare per-run paths
        shell: bash
        run: |
          set -euo pipefail
          job_root="$GITHUB_WORKSPACE/job-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -e "$job_root" ]]; then
            echo "per-run workspace already exists: $job_root" >&2
            exit 1
          fi
          mkdir -m 700 -p "$job_root/candidate-input"
          {
            echo "JOB_ROOT=$job_root"
            echo "CANDIDATE_SOURCE=$job_root/candidate-input/candidate_gemm.cu"
            echo "TRUSTED_BASE=$job_root/trusted-base"
            echo "RESULTS_DIR=$job_root/results"
          } >>"$GITHUB_ENV"

      - name: Check out trusted base verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: job-${{ github.run_id }}-${{ github.run_attempt }}/trusted-base
          ref: ${{ needs.candidate-scope.outputs.verifier_sha }}
          persist-credentials: false

      - name: Download exact candidate blob as data
        shell: bash
        env:
          CANDIDATE_REPOSITORY: ${{ needs.candidate-scope.outputs.candidate_repository }}
          CANDIDATE_SHA: ${{ needs.candidate-scope.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          url="https://raw.githubusercontent.com/${CANDIDATE_REPOSITORY}/${CANDIDATE_SHA}/candidate/candidate_gemm.cu"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 \
            --max-filesize 1048576 \
            --output "$CANDIDATE_SOURCE.tmp" \
            "$url"
          candidate_bytes="$(stat -c '%s' -- "$CANDIDATE_SOURCE.tmp")"
          if (( candidate_bytes == 0 || candidate_bytes > 1048576 )); then
            echo "candidate has invalid size: $candidate_bytes" >&2
            exit 1
          fi
          install -m 400 -- "$CANDIDATE_SOURCE.tmp" "$CANDIDATE_SOURCE"
          rm -f -- "$CANDIDATE_SOURCE.tmp"

      - name: Run candidate in disposable rootless GPU sandbox
        shell: bash
        run: |
          "$TRUSTED_BASE/trusted/run_isolated_competition.sh" \
            "$CANDIDATE_SOURCE" \
            "$TRUSTED_BASE" \
            "$RESULTS_DIR"

      - name: Record immutable candidate identity
        if: always()
        shell: bash
        env:
          CANDIDATE_REPOSITORY: ${{ needs.candidate-scope.outputs.candidate_repository }}
          CANDIDATE_SHA: ${{ needs.candidate-scope.outputs.candidate_sha }}
          VERIFIER_SHA: ${{ needs.candidate-scope.outputs.verifier_sha }}
        run: |
          if [[ -d "$RESULTS_DIR" ]]; then
            printf '%s\n' \
              "candidate_repository=$CANDIDATE_REPOSITORY" \
              "candidate_sha=$CANDIDATE_SHA" \
              "verifier_sha=$VERIFIER_SHA" \
              >"$RESULTS_DIR/identity.txt"
          fi

      - name: Upload verifier and benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gemm-results-${{ needs.candidate-scope.outputs.candidate_sha }}
          path: ${{ github.workspace }}/job-${{ github.run_id }}-${{ github.run_attempt }}/results/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove per-run host workspace
        if: always()
        shell: bash
        run: |
          expected="$GITHUB_WORKSPACE/job-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ "${JOB_ROOT:-}" != "$expected" ]]; then
            echo "refusing unexpected cleanup path: ${JOB_ROOT:-unset}" >&2
            exit 1
          fi
          rm -rf -- "$JOB_ROOT"
